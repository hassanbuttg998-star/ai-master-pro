<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password | FRAZX PRO</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://frazxpro.com/reset-password">
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/hassanbuttg998-star/ai-master-pro/main/pis.jpg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050508;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 600px; height: 400px; pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 70%);
        }
        .card {
            width: 100%; max-width: 420px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 36px 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(99,102,241,0.08);
            position: relative;
        }
        .logo-row {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 28px;
        }
        .logo-row img { width: 28px; height: 28px; border-radius: 50%; }
        .logo-row span { font-size: 16px; font-weight: 900; color: white; letter-spacing: -0.02em; }
        .logo-row .pro {
            font-size: 9px; font-weight: 900; letter-spacing: 0.1em;
            background: linear-gradient(135deg,#7c3aed,#c026d3);
            color: white; padding: 2px 6px; border-radius: 4px;
        }
        h1 {
            font-size: 20px; font-weight: 800; color: white;
            text-align: center; margin-bottom: 6px; letter-spacing: -0.01em;
        }
        .subtitle { color: #64748b; font-size: 13px; text-align: center; margin-bottom: 28px; line-height: 1.6; }
        input {
            width: 100%;
            background: rgba(5,5,8,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { border-color: #6366f1; }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color: white;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg {
            font-size: 12px; text-align: center; margin-top: 14px;
            display: none; padding: 10px; border-radius: 10px;
        }
        .msg.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .msg.success { background: rgba(16,185,129,0.1); color: #4ade80; border: 1px solid rgba(16,185,129,0.2); }
        .success-view { display: none; text-align: center; }
        .success-view i { font-size: 40px; color: #4ade80; margin-bottom: 16px; }
        .success-view a {
            display: inline-block; margin-top: 20px;
            color: #a78bfa; text-decoration: none; font-weight: 700; font-size: 13px;
        }
        .success-view a:hover { text-decoration: underline; }
        .invalid-view { display: none; text-align: center; }
        .invalid-view i { font-size: 40px; color: #f87171; margin-bottom: 16px; }
        .invalid-view a {
            display: inline-block; margin-top: 20px;
            color: #a78bfa; text-decoration: none; font-weight: 700; font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-row">
        <img src="https://raw.githubusercontent.com/hassanbuttg998-star/ai-master-pro/main/pis.jpg" alt="FRAZX PRO">
        <span>FRAZX</span>
        <span class="pro">PRO</span>
    </div>

    <div id="form-view">
        <h1>Set a New Password</h1>
        <p class="subtitle">Choose a new password for your account.</p>
        <input type="password" id="new-password" placeholder="New password (min 6 chars)">
        <input type="password" id="confirm-password" placeholder="Confirm new password">
        <button id="reset-btn" onclick="submitNewPassword()">Update Password</button>
        <div id="msg" class="msg"></div>
    </div>

    <div id="success-view" class="success-view">
        <i class="fa-solid fa-circle-check"></i>
        <h1>Password Updated!</h1>
        <p class="subtitle">You can now sign in with your new password.</p>
        <a href="/">Go to FRAZX PRO →</a>
    </div>

    <div id="invalid-view" class="invalid-view">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h1>Link Expired or Invalid</h1>
        <p class="subtitle">This reset link is no longer valid. Please request a new one from the sign-in page.</p>
        <a href="/">Back to FRAZX PRO →</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://wfmtoodutuaeousykora.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmbXRvb2R1dHVhZW91c3lrb3JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjUwODcsImV4cCI6MjA5NTkwMTA4N30.TCav8aVw4i5KSOKcey-zRrReLPWYosIgclzMyDB5V8w';
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let recoveryReady = false;

    supa.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            recoveryReady = true;
        }
    });

    // Fallback: if there's no recovery event within a few seconds and no session, show invalid link
    setTimeout(async () => {
        if (!recoveryReady) {
            const { data: { session } } = await supa.auth.getSession();
            if (!session) {
                document.getElementById('form-view').style.display = 'none';
                document.getElementById('invalid-view').style.display = 'block';
            }
        }
    }, 3000);

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg ' + type;
        el.style.display = 'block';
    }

    async function submitNewPassword() {
        const pass = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (!pass || pass.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
        if (pass !== confirm) { showMsg('Passwords do not match.', 'error'); return; }

        const btn = document.getElementById('reset-btn');
        btn.disabled = true;
        btn.innerText = 'Updating...';

        const { error } = await supa.auth.updateUser({ password: pass });

        btn.disabled = false;
        btn.innerText = 'Update Password';

        if (error) {
            showMsg('Could not update password. The link may have expired — please request a new one.', 'error');
        } else {
            document.getElementById('form-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'block';
        }
    }
</script>

</body>
</html>
